# Credentials of the LIVE image (development / try-before-install).
# These are public by definition: anyone with the ISO can read them. The
# installer (M12) asks for real credentials and never copies these.
LIVE_USER="gideon"
LIVE_USER_PASSWORD="gideon"
# root cannot log in on any terminal (/etc/securetty is empty); this password
# is only for `su` inside the live session.
LIVE_ROOT_PASSWORD="gideon"

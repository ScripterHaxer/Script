# Displays (applied when the graphical session starts).
# mode: "preferred" or WIDTHxHEIGHT (all outputs). scale: integer output scale.
mode = "preferred"
scale = 1
# renderer: "pixman" (CPU, works everywhere) or "gl" (GPU via Mesa; opt-in
# until hardware GL is validated).
renderer = "pixman"
background = "0f1216"

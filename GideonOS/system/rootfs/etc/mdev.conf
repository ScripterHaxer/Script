# mdev device rules: <device regex> <uid>:<gid> <mode> [=path] [@|$|*command]
# The regex is matched against the kernel's DEVNAME, which includes the
# subsystem directory where there is one (e.g. "input/event0", "dri/card0").
# Groups: tty=5 disk=6 dialout=20 cdrom=24 audio=29 video=44 input=101
null        0:0   666
zero        0:0   666
full        0:0   666
random      0:0   444
urandom     0:0   444
tty         0:5   666
ptmx        0:5   666
tty[0-9]+   0:5   620
ttyS[0-9]+  0:20  660
console     0:5   600
kmsg        0:0   640
rtc[0-9]*   0:0   664
fb[0-9]+    0:44  660
dri/card[0-9]+      0:44  660
dri/renderD[0-9]+   0:44  666
input/event[0-9]+   0:101 660
input/mice          0:101 660
input/mouse[0-9]+   0:101 660

# Block devices: removable media is (un)mounted by the storage service.
sd[a-z].*       0:6  660 */usr/lib/gideon/storage-hotplug
sr[0-9]+        0:24 660 */usr/lib/gideon/storage-hotplug
mmcblk[0-9].*   0:6  660 */usr/lib/gideon/storage-hotplug
vd[a-z].*       0:6  660
nvme[0-9].*     0:6  660
loop[0-9]+      0:6  660

# GideonOS boot menu (GRUB 2). Works for both BIOS and UEFI boot of the ISO.
set timeout=3
set default=0

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

# Kernel messages go to both the screen and the serial port; the last
# console= (tty0) becomes /dev/console.
set gideon_args="console=ttyS0,115200 console=tty0 quiet loglevel=3"

menuentry "GideonOS" {
    echo "Starting GideonOS..."
    linux /boot/vmlinuz $gideon_args
    initrd /boot/initramfs.img
}

menuentry "GideonOS (verbose boot)" {
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 loglevel=7
    initrd /boot/initramfs.img
}

menuentry "GideonOS (safe graphics: nomodeset)" {
    linux /boot/vmlinuz $gideon_args nomodeset
    initrd /boot/initramfs.img
}

menuentry "GideonOS (verify boot media first)" {
    linux /boot/vmlinuz $gideon_args gideon.verify=1
    initrd /boot/initramfs.img
}

menuentry "GideonOS (rescue shell before mounting root)" {
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 loglevel=7 gideon.break=premount
    initrd /boot/initramfs.img
}

menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
